server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        - id: cart-service
          uri: lb://cart-service
          predicates:
            - Path=/cart/**

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/orders/**

        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/payments/**

        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/inventory/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/notifications/**

          - id: review-service
            uri: lb://review-service
            predicates:
              - Path=/reviews/**


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8762/eureka
