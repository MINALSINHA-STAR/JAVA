# ===============================
# Server Configuration
# ===============================
server:
  port: 8083

# ===============================
# Spring Configuration
# ===============================
spring:
  application:
    name: mycart-user-service

  datasource:
    url: jdbc:mysql://localhost:3306/userdb
    username: root
    password: Kali@123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
 
# ===============================
# Eureka Configuration  ✅ FIXED
# ===============================
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8762/eureka/
    register-with-eureka: true
    fetch-registry: true

# ===============================
# Tracing & Actuator
# ===============================
management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: "*"

# ===============================
# Logging
# ===============================
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %5p [${spring.application.name},%X{traceId},%X{spanId}] %logger{36} - %msg%n"
