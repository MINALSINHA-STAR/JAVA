# ===============================
# Server Configuration
# ===============================
server:
  port: 8082

# ===============================
# Spring Configuration
# ===============================
spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:mysql://localhost:3306/orderdb
    username: root
    password: Kali@123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

        zipkin:
    base-url: http://localhost:9411   # changed from host.docker.internal
    enabled: true

  sleuth:
    sampler:
      probability: 1.0
    propagation-keys:
      - b3
      - X-B3-TraceId
      - X-B3-SpanId
      - X-B3-ParentSpanId
      - X-B3-Sampled
      - X-B3-Flags

# ===============================
# Eureka Configuration
# ===============================
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

      management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %5p [${spring.application.name},%X{traceId},%X{spanId}] %logger{36} - %msg%n"
