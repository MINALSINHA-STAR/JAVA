# ===============================
# Server Configuration
# ===============================
#server:
 # port: 8081        # Order Service runs on port 8081

# ===============================
# Spring Configuration
# ===============================
spring:
  application:
    name: order-service    # Service name (used by Eureka & Config Server)

  profiles:
    active: dev             # Active profile (dev environment)

  # -------------------------------
  # Spring Cloud Config Server
  # -------------------------------
  config:
    import: configserver:http://localhost:8888
    # Fetch configuration from Config Server running on port 8888

  # -------------------------------
  # Database Configuration (MySQL)
  # -------------------------------
  datasource:
    url: jdbc:mysql://localhost:3306/orderdb
    username: root
    password: Kali@123
    driver-class-name: com.mysql.cj.jdbc.Driver

  # -------------------------------
  # JPA / Hibernate Configuration
  # -------------------------------
  jpa:
    hibernate:
      ddl-auto: update      # Auto create/update tables
    show-sql: true          # Show SQL queries in console
    properties:
      hibernate:
        format_sql: true    # Format SQL for readability
